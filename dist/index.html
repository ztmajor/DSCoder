<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSCoder</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1115;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #e8eaed;
      }
      .logo {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .spin {
        width: 24px;
        height: 24px;
        border: 2px solid #2c2c2e;
        border-top-color: #99c8ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .hint {
        font-size: 13px;
        color: #9aa0a6;
      }
    </style>
  </head>
  <body>
    <div class="logo">DSCoder</div>
    <div class="spin"></div>
    <div class="hint">正在启动 dsh 内核…</div>
  </body>
</html>
